version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synexis-systems
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - synexis-network

networks:
  synexis-network:
    driver: bridge
